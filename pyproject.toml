[project]
name = "worldcup-predictor"
version = "0.1.0"
description = "MCP-based 1X2 predictor for the 2026 FIFA World Cup"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "dotenv>=0.9.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
